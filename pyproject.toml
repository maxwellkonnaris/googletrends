[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendspull"
version = "0.1.0.dev0"
description = "Collect Google Trends timelines as a tidy pandas DataFrame"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "pandas>=1.5"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.urls]
Repository = "https://github.com/maxwellkonnaris/googletrends"
Issues = "https://github.com/maxwellkonnaris/googletrends/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
