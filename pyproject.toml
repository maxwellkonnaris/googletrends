[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendspull"
version = "0.1.0"
description = "Collect Google Trends timelines as a tidy pandas DataFrame"
readme = "docs/python-package.md"
authors = [{name = "Maxwell A. Konnaris", email = "maxwellkonnaris@gmail.com"}]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.28", "pandas>=1.5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=7,<10", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/maxwellkonnaris/googletrends"
Issues = "https://github.com/maxwellkonnaris/googletrends/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
