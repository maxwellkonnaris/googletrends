name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install 'dist/trendspull-0.1.0-py3-none-any.whl[test]'
      - run: python -m pip check
      - run: python -m pytest -q
  native-r:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RETICULATE_PYTHON: /python-is-not-required
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r-package
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install 'dist/trendspull-0.1.0-py3-none-any.whl[test]'
      - run: R CMD INSTALL r-package
      - run: python -m pytest -q tests/test_native_r.py tests/test_interoperability.py
        env:
          TRENDSPULL_REQUIRE_NATIVE_R: '1'
