name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q
  r-interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: python -m pip install '.[test]'
      - run: Rscript -e 'install.packages(c("reticulate", "ggplot2", "patchwork", "testthat", "withr"), repos=Sys.getenv("RSPM"))'
      - run: R CMD INSTALL r-package
      - run: Rscript -e 'library(trendspull); stopifnot(!reticulate::py_available(initialize=FALSE))'
      - run: R CMD build r-package
      - run: R CMD check --no-manual trendspull_0.1.0.9000.tar.gz
        env:
          TRENDSPULL_REQUIRE_R: '1'
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
          RETICULATE_USE_MANAGED_VENV: 'no'
      - run: python -m pytest -q tests/test_r_interface.py tests/test_interoperability.py
        env:
          TRENDSPULL_REQUIRE_R: '1'
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
